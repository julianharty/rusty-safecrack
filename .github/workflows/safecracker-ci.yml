name: Safe-Cracker Combinatorial Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # --- STAGE 1: RUN THE COMPILED RUST ENGINE ---
  audit-rust:
    name: Execute Rust Concurrent Matrix Sweep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Set Up Python for the Reference Server
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Reference Server Dependencies
        run: pip install -r server/requirements.txt

      # The reference server must live in the SAME step as the tool run: a
      # process backgrounded with '&' in one step is torn down when that step's
      # shell exits, so it would be gone by the next step.
      - name: Launch Reference Server and Run Security Audit
        working-directory: rust
        run: |
          python ../server/safe_server.py --port 5004 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5004/ >/dev/null && { echo "Reference server is up."; break; }
            sleep 1
          done
          cargo run --release --bin safecracker http://localhost:5004 --delay 0

      - name: Show Server Log on Failure
        if: failure()
        run: cat rust/server.log || true

      - name: Archive Rust Verification Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-safecrack-report
          path: rust/safecrack_report.md
          retention-days: 7

  # --- STAGE 2: RUN THE MODERN TYPESCRIPT ENGINE ---
  audit-typescript:
    name: Execute TypeScript State-Shared Sweep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Node.js Environment (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set Up Python for the Reference Server
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Reference Server Dependencies
        run: pip install -r server/requirements.txt

      - name: Install Application Dependencies
        working-directory: typescript
        run: npm ci || npm install

      - name: Launch Reference Server and Run Security Audit
        working-directory: typescript
        run: |
          python ../server/safe_server.py --port 5004 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5004/ >/dev/null && { echo "Reference server is up."; break; }
            sleep 1
          done
          node --experimental-strip-types safecracker.ts http://localhost:5004 --attempts 10 --delay 0

      - name: Show Server Log on Failure
        if: failure()
        run: cat typescript/server.log || true

      - name: Archive TypeScript Verification Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-safecrack-report
          path: typescript/safecrack_report.md
          retention-days: 7
