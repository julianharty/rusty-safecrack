name: Safe-Cracker Combinatorial Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  # --- STAGE 1: RUN THE COMPILED RUST ENGINE ---
  audit-rust:
    name: Execute Rust Concurrent Matrix Sweep
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # New Step: Initialize your challenge backend inside the runner framework environment
      - name: Launch Test Portal Server in Background
        run: |
          # Replace 'node server.js' with your exact local execution command (e.g. python -m http.server 5004)
          node server.js & 
          sleep 3 # Critical boundary window: wait for socket binding sequence to clear

      - name: Compile and Run Security Audit
        run: |
          # We point directly to our freshly initialized local loopback interface
          cargo run --release --bin safecracker http://localhost:5004 --delay 20

      - name: Archive Rust Verification Report
        uses: actions/upload-artifact@v4
        with:
          name: rust-safecrack-report
          path: ./safecrack_report.md
          retention-days: 7

  # --- STAGE 2: RUN THE MODERN TYPESCRIPT ENGINE ---
  audit-typescript:
    name: Execute TypeScript State-Shared Sweep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Node.js Environment (v25)
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'npm'
          cache-dependency-path: './package.json'

      - name: Install Application Dependencies
        run: |
          npm ci || npm install

      # New Step: Mirror the identical local background server startup sequence here
      - name: Launch Test Portal Server in Background
        run: |
          node server.js & 
          sleep 3

      - name: Execute Native TypeScript Script
        run: |
          node --experimental-strip-types safecracker.ts http://localhost:5004 --attempts 10 --delay 20

      - name: Archive TypeScript Verification Report
        uses: actions/upload-artifact@v4
        with:
          name: typescript-safecrack-report
          path: ./safecrack_report.md
          retention-days: 7

